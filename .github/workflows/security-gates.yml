name: Security Gates 🛡️

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate Workflow
        run: echo "Validation successful"

  security-gates:
    uses: Trendyol/security-actions/.github/workflows/security-gates.yml@6913e06d97cb76a31539576e5f9d7c92f8de1cf7
    permissions:
      actions: read
      contents: read
      security-events: write