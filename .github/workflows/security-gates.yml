name: Security Gates 🛡️

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate Workflow
        run: echo "Validation successful"

  security-gates:
    uses: Trendyol/security-actions/.github/workflows/security-gates.yml@df29aceaed00e6de333c30943cd9f52cfe9dd914
    permissions:
      actions: read
      contents: read
      security-events: write